name: daewingmod

on:
  workflow_dispatch:
  push:
    branches:
      - personal/**
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - ".github/workflows/daewingmod.yml"
      - "Makefile"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".gitmodules"
      - ".github/workflows/daewingmod.yml"
      - "Makefile"

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run unit tests
        env:
          GOFLAGS: -mod=mod -modcacherw
        run: |
          go test -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Build dae-wing
        env:
          GOFLAGS: -mod=mod -modcacherw
          VERSION: test-${{ github.sha }}
          OUTPUT: ./dae-wing-test
        run: |
          make dae-wing
          ./dae-wing-test export schema >/dev/null
